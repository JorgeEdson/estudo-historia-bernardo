<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura de Estudos do Bernardo</title>
  <meta name="description" content="Estudo interativo de Geografia — 4ª etapa: os lugares são diferentes, as paisagens mudam, o município e seus espaços.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <div id="confete" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
